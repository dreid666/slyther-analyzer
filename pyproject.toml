[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slyther-analyzer"
version = "0.1.0"
description = "Deterministic static security scanner for EVM, Cosmos SDK, and Bitcoin codebases with SARIF v2.1.0 output"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Daniel James Reid"}
]
keywords = ["security", "smart-contracts", "sarif", "evm", "cosmos", "bitcoin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
slyther-analyzer = "slyther_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
