name: Slyther Agent

on:
  pull_request:
  push:

permissions:
  contents: read
  security-events: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Slyther Agent
        id: slyther
        uses: ./
        with:
          target: .
          output: slyther-analyzer.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slyther.outputs.sarif }}
